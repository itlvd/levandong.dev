<a class="book-card" href="{{ .Permalink }}">
  {{- if .Params.bookCover }}
  <div class="book-cover">
    <img src="{{ .Params.bookCover }}" alt="{{ .Title }}" loading="lazy">
  </div>
  {{- else }}
  <div class="book-cover book-cover-placeholder">
    <span>{{ .Title | truncate 40 }}</span>
  </div>
  {{- end }}
  <div class="book-info">
    <h3 class="book-title">{{ .Title }}</h3>
    {{- if .Params.bookAuthor }}
    <p class="book-author">{{ .Params.bookAuthor }}</p>
    {{- end }}
    {{- if .Description }}
    <p class="book-description">{{ .Description | truncate 120 }}</p>
    {{- end }}
  </div>
</a>
